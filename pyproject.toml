[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sgl-analytic"
version = "0.1.0"
description = "Sampling-free stochastic weak-lensing magnification PDFs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3", "scipy>=1.13,<2", "numba>=0.61,<1"]

[project.optional-dependencies]
notebooks = ["matplotlib", "ipykernel", "nbformat", "nbclient", "pandas"]
test = ["pytest>=8"]

[project.scripts]
sgl-analytic = "sgl_analytic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sgl_analytic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
